<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ELN Core — Browser Example (0.2.0)</title>
<style>
  body { font-family: monospace; padding: 24px; max-width: 860px; margin: 0 auto; }
  #output { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 8px; min-height: 240px; }
  button { padding: 8px 16px; margin: 4px; cursor: pointer; }
  input  { padding: 6px 10px; width: 300px; }
  .meta  { color: #555; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>
<h2>ELN Core — Browser Demo</h2>

<div>
  <input id="api-key" type="password" placeholder="DeepSeek API Key (sk-...)" />
</div>
<br>
<button onclick="generate('republican')">生成：民国谍战</button>
<button onclick="generate('xianxia')">生成：架空修仙</button>
<button onclick="generate('campus')">生成：校园青春</button>
<br>
<button onclick="runTurn()">推进一回合 ▶</button>
<button onclick="showPerspective()">查看角色视角 👁</button>
<button onclick="showSeeds()">未回收伏笔 🧵</button>
<button onclick="branch()">分支世界线 ⑂</button>
<button onclick="saveWorld()">存档 💾</button>
<hr>
<div class="meta" id="status">等待中…</div>
<div id="output"></div>

<script type="module">
  // In production: import { ELNRuntime, genrePack, stylePack } from '@lant1ng/eln-core'
  import { ELNRuntime, genrePack, stylePack } from '../index.js';

  const out = () => document.getElementById('output');
  const status = () => document.getElementById('status');
  const write = t => { out().textContent += t; };
  const line = t => { out().textContent += `\n${t}\n`; };

  let eln = null;
  let currentKey = '';

  function getRuntime() {
    const key = document.getElementById('api-key').value.trim();
    if (!key) { alert('请先填写 API Key'); return null; }

    if (!eln || currentKey !== key) {
      currentKey = key;
      eln = new ELNRuntime({
        apiKey: key,
        // Genre/style are data. Changing the pack changes the voice entirely.
        packs: [genrePack('republican'), stylePack('zh-literary')],
        // Storage adapter: localStorage in the browser, memory on Node.
        onToken: token => write(token),
        onTurnEnd: result => {
          line(`\n── 摘要：${result.summary}`);
          line(`── 时空：${result.canon.location} / ${result.canon.time}`);
          line(`── 张力：${result.canon.tension}/100（目标 ${result.beatSpec.tensionTarget}）`);
          if (result.degraded.length) line(`⚠ 降级：${result.degraded.join(', ')}`);
        },
      });
    }
    return eln;
  }

  window.generate = async (genre) => {
    const runtime = getRuntime(); if (!runtime) return;
    out().textContent = '生成世界中…\n';
    try {
      const world = await runtime.generateWorld({ genre });
      runtime.loadWorld(world);
      line(`世界：${world.name}（${world.tag}）`);
      line(`角色：${world.characters.map(c => c.name).join('、')}`);
      status().textContent = `已载入《${world.name}》— 点击「推进一回合」`;
    } catch (e) { line('错误：' + e.message); }
  };

  window.runTurn = async () => {
    const runtime = getRuntime(); if (!runtime) return;
    if (!runtime.isWorldLoaded) { line('请先生成一个世界。'); return; }
    out().textContent = '';
    try {
      const result = await runtime.runTurn();
      status().textContent = `第 ${result.turn} 回合 · 版本 v${result.canon.version}`;
    } catch (e) { line('错误：' + e.message); }
  };

  window.showPerspective = () => {
    const runtime = getRuntime(); if (!runtime) return;
    if (!runtime.isWorldLoaded) { line('请先生成一个世界。'); return; }
    const names = runtime.getState().canon.entities
      .filter(e => e.kind === 'character').map(e => e.name);
    const picked = prompt(`查看谁的视角？\n${names.join('、')}`, names[1] ?? names[0]);
    if (!picked) return;

    const entity = runtime.getCharacter(picked);
    if (!entity) { line(`找不到角色：${picked}`); return; }

    const view = runtime.getState({ perspective: entity.id });
    out().textContent = '';
    line(`── ${entity.name} 的视角 ──`);
    line(`已知事实：${view.visibleFacts.map(f => f.object).join('；') || '（无）'}`);
    line(`仍不知晓：${view.hiddenFacts.length} 件事（其中有 ${view.hiddenFacts.filter(f => f.tags.includes('secret')).length} 个秘密）`);
    line('\n（其他人的秘密不会出现在这里——这是引擎的结构保证，不是提示词措辞。）');
  };

  window.showSeeds = () => {
    const runtime = getRuntime(); if (!runtime) return;
    if (!runtime.isWorldLoaded) { line('请先生成一个世界。'); return; }
    const seeds = runtime.getOpenSeeds();
    out().textContent = '';
    line('── 未回收的伏笔（按紧迫度排序）──');
    if (!seeds.length) line('（暂无）');
    for (const s of seeds) line(`[${s.urgency.toFixed(2)}] ${s.text}（第 ${s.plantedTurn} 回合埋下）`);
  };

  window.branch = () => {
    const runtime = getRuntime(); if (!runtime) return;
    if (!runtime.isWorldLoaded) { line('请先生成一个世界。'); return; }
    const from = runtime.getState().canon.version;
    runtime.branch({ from });
    line(`\n⑂ 已从版本 v${from} 分出新世界线`);
    line('历史：' + runtime.history().map(h => `v${h.version}@T${h.turn}`).join(' → '));
  };

  window.saveWorld = async () => {
    const runtime = getRuntime(); if (!runtime) return;
    if (!runtime.isWorldLoaded) { line('请先生成一个世界。'); return; }
    const id = await runtime.save('browser-demo');
    line(`\n💾 已保存：${id}`);
    const list = await runtime.listSavedWorlds('browser-demo');
    for (const w of list) line(`  · 《${w.name}》第 ${w.turn} 回合（${w.charCount} 角色）`);
  };
</script>
</body>
</html>
